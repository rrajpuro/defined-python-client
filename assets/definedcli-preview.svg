<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title description">
  <title id="title">definedcli host listing</title>
  <desc id="description">A terminal preview showing two fictional Defined Networking hosts in table output.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#010409" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="960" height="290" rx="16" fill="#0d1117" filter="url(#shadow)"/>
  <path d="M36 20h928a16 16 0 0 1 16 16v36H20V36a16 16 0 0 1 16-16z" fill="#161b22"/>
  <circle cx="52" cy="46" r="7" fill="#ff5f57"/>
  <circle cx="76" cy="46" r="7" fill="#febc2e"/>
  <circle cx="100" cy="46" r="7" fill="#28c840"/>
  <text x="500" y="52" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">definedcli</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="52" y="112" fill="#58a6ff">$</text>
    <text x="74" y="112" fill="#f0f6fc">definedcli</text>
    <text x="180" y="112" fill="#d2a8ff">--output table</text>
    <text x="342" y="112" fill="#f0f6fc">hosts list</text>

    <text x="52" y="158" fill="#8b949e">id</text>
    <text x="192" y="158" fill="#8b949e">isLighthouse</text>
    <text x="382" y="158" fill="#8b949e">name</text>
    <text x="650" y="158" fill="#8b949e">roleID</text>

    <line x1="52" y1="181" x2="790" y2="181" stroke="#484f58" stroke-width="1" stroke-dasharray="7 4"/>

    <text x="52" y="220" fill="#79c0ff">host-2F7K</text>
    <text x="192" y="220" fill="#3fb950">true</text>
    <text x="382" y="220" fill="#f0f6fc">edge-router-01</text>
    <text x="650" y="220" fill="#ffa657">role-router</text>

    <text x="52" y="252" fill="#79c0ff">host-9A3M</text>
    <text x="192" y="252" fill="#f85149">false</text>
    <text x="382" y="252" fill="#f0f6fc">web-prod-01</text>
    <text x="650" y="252" fill="#ffa657">role-web</text>

    <circle cx="61" cy="280" r="9" fill="#238636"/>
    <path d="m57 280 3 3 6-7" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="286" fill="#8b949e">JSON for scripts. Tables for humans.</text>
  </g>
</svg>
